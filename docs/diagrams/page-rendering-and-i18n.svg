<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>danielgarcia.it: how one page is rendered and how its language is chosen</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/></marker><filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/></filter><linearGradient id="top" x1="0" x2="1"><stop offset="0" stop-color="#1e40af"/><stop offset="0.5" stop-color="#7c3aed"/><stop offset="1" stop-color="#be185d"/></linearGradient><linearGradient id="badge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4338ca"/><stop offset="1" stop-color="#be185d"/></linearGradient></defs>
<rect width="1400" height="960" fill="#f8fafc"/><rect x="0" y="0" width="1400" height="7" fill="url(#top)"/>
<text x="40" y="48" font-size="24" font-weight="bold" fill="#0f172a" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start">Detail: how one page is rendered, and how its language is chosen</text>
<text x="40" y="74" font-size="14" font-weight="normal" fill="#475569" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start">Example: the French About page /a-propos/. The English page /en/about/ follows the same path with lang: en. Overview: pages-from-data.svg.</text>
<rect x="40" y="110" width="400" height="320" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2" filter="url(#sh)"/>
<path d="M40,122 a12,12 0 0 1 12,-12 h376 a12,12 0 0 1 12,12 v21 h-400 z" fill="#c2410c"/>
<text x="54" y="136" font-size="15" font-weight="bold" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start">content/a-propos/index.html</text>
<text x="54" y="161" font-size="12.5" font-weight="normal" fill="#475569" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" font-style="italic">the page: front matter, then its body</text>
<text x="54" y="190" font-size="12.5" font-weight="bold" fill="#9a3412" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start">Front matter (between the --- lines)</text>
<text x="54" y="214" font-size="13" font-weight="normal" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">title: À propos de ce site</text>
<text x="54" y="238" font-size="13" font-weight="normal" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">description: "Comment le site…"</text>
<text x="54" y="262" font-size="13" font-weight="bold" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">lang: fr</text>
<text x="54" y="286" font-size="13" font-weight="bold" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">translation: /en/about/</text>
<text x="54" y="310" font-size="12.5" font-weight="bold" fill="#9a3412" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start">Body</text>
<text x="54" y="334" font-size="13" font-weight="normal" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">{#include partials/about-page /}</text>
<text x="54" y="358" font-size="12.5" font-weight="normal" fill="#475569" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start">No &lt;!DOCTYPE at the start: a fragment,</text>
<text x="54" y="382" font-size="12.5" font-weight="normal" fill="#475569" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start">so Roq wraps it in the page layout.</text>
<rect x="40" y="460" width="400" height="120" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2" filter="url(#sh)"/>
<path d="M40,472 a12,12 0 0 1 12,-12 h376 a12,12 0 0 1 12,12 v21 h-400 z" fill="#c2410c"/>
<text x="54" y="486" font-size="15" font-weight="bold" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start">content/en/about/index.html</text>
<text x="54" y="511" font-size="12.5" font-weight="normal" fill="#475569" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" font-style="italic">same page, other language</text>
<text x="54" y="540" font-size="13" font-weight="bold" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">lang: en</text>
<text x="54" y="562" font-size="13" font-weight="bold" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">translation: /a-propos/</text>
<rect x="520" y="110" width="400" height="300" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#sh)"/>
<path d="M520,122 a12,12 0 0 1 12,-12 h376 a12,12 0 0 1 12,12 v21 h-400 z" fill="#1d4ed8"/>
<text x="534" y="136" font-size="15" font-weight="bold" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start">data/ (Roq Data)</text>
<text x="534" y="161" font-size="12.5" font-weight="normal" fill="#475569" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" font-style="italic">one file per language, read by name</text>
<text x="534" y="190" font-size="13" font-weight="bold" fill="#1e3a8a" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start">i18n/fr.yml</text>
<text x="534" y="213" font-size="13" font-weight="normal" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">mainMenu: "Menu principal"</text>
<text x="534" y="236" font-size="13" font-weight="normal" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">languageSwitch: "Langue"</text>
<text x="534" y="259" font-size="13" font-weight="bold" fill="#1e3a8a" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start">about/fr.yml (through its records)</text>
<text x="534" y="282" font-size="13" font-weight="normal" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">- id: "principle"</text>
<text x="534" y="305" font-size="13" font-weight="normal" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">  title: "Le principe"</text>
<text x="534" y="328" font-size="12.5" font-weight="normal" fill="#475569" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start">lang picks the file:</text>
<text x="534" y="351" font-size="13" font-weight="bold" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">cdi:i18n.get("fr"), cdi:about.get("fr")</text>
<rect x="1000" y="110" width="360" height="300" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2" filter="url(#sh)"/>
<path d="M1000,122 a12,12 0 0 1 12,-12 h336 a12,12 0 0 1 12,12 v21 h-360 z" fill="#6d28d9"/>
<text x="1014" y="136" font-size="15" font-weight="bold" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start">Roq and Qute</text>
<text x="1014" y="161" font-size="12.5" font-weight="normal" fill="#475569" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" font-style="italic">the engine that assembles the page</text>
<text x="1014" y="190" font-size="13" font-weight="normal" fill="#1f2937" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start">Roq reads the page, its front matter,</text>
<text x="1014" y="212" font-size="13" font-weight="normal" fill="#1f2937" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start">the layout and the partials; Qute</text>
<text x="1014" y="234" font-size="13" font-weight="normal" fill="#1f2937" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start">replaces every {…} with its value and</text>
<text x="1014" y="256" font-size="13" font-weight="normal" fill="#1f2937" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start">escapes HTML characters.</text>
<text x="1014" y="278" font-size="13" font-weight="bold" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">page = the page being rendered</text>
<text x="1014" y="300" font-size="12.5" font-weight="normal" fill="#1f2937" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start">page.title, page.data.lang, …</text>
<text x="1014" y="322" font-size="12.5" font-weight="normal" fill="#1f2937" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start">visible in the layout and every partial;</text>
<text x="1014" y="344" font-size="12.5" font-weight="normal" fill="#1f2937" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start">other variables are not: each partial</text>
<text x="1014" y="366" font-size="12.5" font-weight="normal" fill="#1f2937" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start">declares its own {#let}.</text>
<rect x="520" y="460" width="400" height="360" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2" filter="url(#sh)"/>
<path d="M520,472 a12,12 0 0 1 12,-12 h376 a12,12 0 0 1 12,12 v21 h-400 z" fill="#4338ca"/>
<text x="534" y="486" font-size="15" font-weight="bold" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start">layout and partials</text>
<text x="534" y="511" font-size="12.5" font-weight="normal" fill="#475569" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" font-style="italic">templates/layouts/page.html, templates/partials/</text>
<text x="534" y="540" font-size="13" font-weight="normal" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">&lt;html lang="{page.data.lang}"&gt;</text>
<text x="534" y="566" font-size="13" font-weight="normal" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">&lt;title&gt;{page.title} — {site.title}&lt;/title&gt;</text>
<text x="534" y="592" font-size="13" font-weight="bold" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">{#include partials/header /}</text>
<text x="534" y="618" font-size="13" font-weight="normal" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">  {#let t=cdi:i18n.get(page.data.lang)}</text>
<text x="534" y="644" font-size="13" font-weight="normal" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">  &lt;nav aria-label="{t.mainMenu}"&gt;</text>
<text x="534" y="670" font-size="13" font-weight="normal" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">  EN → {page.data.translation}</text>
<text x="534" y="696" font-size="13" font-weight="bold" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">&lt;main id="content"&gt;{#insert /}&lt;/main&gt;</text>
<text x="534" y="722" font-size="13" font-weight="normal" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">  about-page: {#let about=cdi:about…}</text>
<text x="534" y="748" font-size="13" font-weight="normal" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">  {#for section in about.sections}</text>
<text x="534" y="774" font-size="13" font-weight="bold" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">{#include partials/footer /}</text>
<rect x="1000" y="460" width="360" height="360" rx="12" fill="#ecfeff" stroke="#06b6d4" stroke-width="2" filter="url(#sh)"/>
<path d="M1000,472 a12,12 0 0 1 12,-12 h336 a12,12 0 0 1 12,12 v21 h-360 z" fill="#0e7490"/>
<text x="1014" y="486" font-size="15" font-weight="bold" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start">target/roq/a-propos/index.html</text>
<text x="1014" y="511" font-size="12.5" font-weight="normal" fill="#475569" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start" font-style="italic">the HTML sent to the browser</text>
<text x="1014" y="540" font-size="13" font-weight="normal" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">&lt;html lang="fr"&gt;</text>
<text x="1014" y="566" font-size="13" font-weight="normal" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">&lt;title&gt;À propos de ce site —</text>
<text x="1014" y="592" font-size="13" font-weight="normal" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">  Daniel Garcia&lt;/title&gt;</text>
<text x="1014" y="618" font-size="13" font-weight="normal" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">&lt;nav aria-label="Menu principal"&gt;</text>
<text x="1014" y="644" font-size="13" font-weight="normal" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">  &lt;a href="/en/about/"</text>
<text x="1014" y="670" font-size="13" font-weight="normal" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">     hreflang="en"&gt;EN&lt;/a&gt;</text>
<text x="1014" y="696" font-size="13" font-weight="normal" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">&lt;main id="content"&gt;</text>
<text x="1014" y="722" font-size="13" font-weight="normal" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">  &lt;h1&gt;À propos de ce site&lt;/h1&gt;</text>
<text x="1014" y="748" font-size="13" font-weight="normal" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">  &lt;section id="principle"&gt;</text>
<text x="1014" y="774" font-size="13" font-weight="normal" fill="#1f2937" font-family="Consolas, Menlo, monospace" text-anchor="start">    &lt;h2&gt;Le principe&lt;/h2&gt;</text>
<path d="M440,270 L480,270 L480,640 L516,640" fill="none" stroke="#6366f1" stroke-width="2.8" marker-end="url(#arr)" stroke-linecap="round"/>
<circle cx="480" cy="455" r="13" fill="url(#badge)" stroke="#ffffff" stroke-width="2"/>
<text x="480" y="460" font-size="14" font-weight="bold" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">1</text>
<path d="M720,410 L720,456" fill="none" stroke="#6366f1" stroke-width="2.8" marker-end="url(#arr)" stroke-linecap="round"/>
<circle cx="720" cy="433" r="13" fill="url(#badge)" stroke="#ffffff" stroke-width="2"/>
<text x="720" y="438" font-size="14" font-weight="bold" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">2</text>
<text x="742" y="429" font-size="12.5" font-weight="normal" fill="#334155" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start">t = i18n/fr.yml, about = about/fr.yml</text>
<text x="742" y="445" font-size="12.5" font-weight="normal" fill="#334155" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start">(lang: fr)</text>
<path d="M920,640 L996,640" fill="none" stroke="#6366f1" stroke-width="2.8" marker-end="url(#arr)" stroke-linecap="round"/>
<circle cx="958" cy="640" r="13" fill="url(#badge)" stroke="#ffffff" stroke-width="2"/>
<text x="958" y="645" font-size="14" font-weight="bold" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">3</text>
<text x="958" y="673" font-size="12.5" font-weight="normal" fill="#334155" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">Qute fills</text>
<text x="958" y="689" font-size="12.5" font-weight="normal" fill="#334155" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">every {…}</text>
<path d="M1180,410 L1180,456" fill="none" stroke="#6366f1" stroke-width="2.8" marker-end="url(#arr)" stroke-linecap="round"/>
<text x="40" y="862" font-size="16" font-weight="bold" fill="#0f172a" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start">The steps</text>
<circle cx="54" cy="883" r="13" fill="url(#badge)" stroke="#ffffff" stroke-width="2"/>
<text x="54" y="888" font-size="14" font-weight="bold" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">1</text>
<text x="78" y="888" font-size="13.5" font-weight="normal" fill="#1f2937" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start">Roq reads content/a-propos/index.html: the front matter becomes page (title, data.lang, data.translation), the body goes to {#insert /}.</text>
<circle cx="54" cy="911" r="13" fill="url(#badge)" stroke="#ffffff" stroke-width="2"/>
<text x="54" y="916" font-size="14" font-weight="bold" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">2</text>
<text x="78" y="916" font-size="13.5" font-weight="normal" fill="#1f2937" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start">The layout and each partial read page.data.lang (fr) and take the matching files: t from i18n/fr.yml, about from about/fr.yml.</text>
<circle cx="54" cy="939" r="13" fill="url(#badge)" stroke="#ffffff" stroke-width="2"/>
<text x="54" y="944" font-size="14" font-weight="bold" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">3</text>
<text x="78" y="944" font-size="13.5" font-weight="normal" fill="#1f2937" font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="start">Qute replaces every {…}, inserts the body and the partials. The result is a complete HTML page in French: target/roq/a-propos/index.html.</text>
</svg>