# data/i18n/fr.yml
# danielgarcia.it — French interface texts
# ─────────────────────────────────────────────────────────────────────────────
# Texts shared by every page, read by templates/layouts/page.html through
# cdi:i18n. en.yml has exactly the same keys. Page content stays in content/.

# Accessible name of the language switch, read aloud by screen readers
languageSwitch: "Langue"

# Theme button of the header: visible text (the theme it switches to) and
# accessible name, read aloud by screen readers
themeDark: "Sombre"
themeDarkLabel: "Passer au thème sombre"
themeLight: "Clair"
themeLightLabel: "Passer au thème clair"

# Header: link that skips to the content, accessible name of the menu, first
# entry of the menu, address of the home page (target of the menu entries)
skipLink: "Aller au contenu"
mainMenu: "Menu principal"
profile: "Profil"
homeUrl: "/"

# Menu entry of the panel "About this site", and address of the About page
about: "À propos"
aboutUrl: "/a-propos/"

# Button of small screens that opens the menu
menu: "Menu"

# Label of the button that opens the CV in PDF
cv: "CV (PDF)"

# Label of the e-mail button in the compact profile of the header (the large profile shows the address)
email: "E-mail"

# Read by screen readers after a link that opens in a new tab
newTab: "(nouvel onglet)"

# Title of the projects section of the home page
projects: "Projets"

# Labels of the links of a project card
code: "Code"
site: "Site"

# Labels of the details of a project, shown in its dialog
open: "Ouvrir"
close: "Fermer"
frame: "Cadre"
client: "Mandant"
role: "Rôle"
completed: "Réalisé"
grade: "Note"
overview: "Présentation"
highlights: "Points forts"
skills: "Compétences"
stack: "Technologies"
download: "Télécharger"
play: "Jouer"

# Titles of the two groups of the projects page
featuredProjects: "Projets principaux"
otherProjects: "Autres projets"

# Link from the projects section of the home page to the projects page
allProjects: "Voir tous les projets"
allProjectsUrl: "/projets/"

# Career section of the home page
career: "Parcours"
experience: "Expérience professionnelle"
period: "Période"
present: "aujourd’hui"
tasks: "Tâches"
education: "Formation"
certifications: "Certifications"
obtained: "Obtenu"
training: "Voir la formation"
languages: "Langues"

# Label of a place in the facts of a large card of the career
location: "Lieu"

# Footer: link to the source code of the site, link to the privacy page
siteSource: "Code source du site"
privacy: "Confidentialité"
privacyUrl: "/confidentialite/"

# Line that opens a folded terminal on the About page
terminal: "Voir dans le terminal"
