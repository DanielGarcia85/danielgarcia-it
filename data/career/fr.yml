profile:
  - "Je travaille dans l’informatique depuis plus de dix ans. J’ai évolué jusqu’à l’administration des systèmes et des réseaux, puis j’ai repris mes études pour me réorienter vers l’ingénierie logicielle, en parallèle d’un poste en support informatique à l’Université de Genève."
  - "En 2026, j’ai obtenu mon [Bachelor of Science HES-SO](https://heg.hesge.ch/formations/bachelors/informatique-gestion) en Informatique de gestion à la [HEG Genève](https://heg.hesge.ch/)."
  - "Je cherche actuellement un poste de développeur full stack, d’ingénieur DevOps ou d’ingénieur logiciel, à Genève."

