      - "**Database modelling**: logical model, then physical model and SQL script, later turned into Laravel migrations."
      - "**C# WinForms desktop client (.NET 8), 16 windows**: token login, data browsing and full management of the six resources through the API (bookings, customers, stylists and their absences, services, users)."
