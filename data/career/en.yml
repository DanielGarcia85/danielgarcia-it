  - id: "zebra-girafe"
    title: "Zebra-Girafe"
    frame: "Client project, HEG Geneva, in a team of four"
    client: "Medical: Dr Dany Minetto, cardiologist, Centre de Cardiologie des Nations. Technical: Julien Ribon, CTO, Airel Consulting Sàrl."
    role: "Scrum Master and in charge of communication with the clients and the steering committee; author of the application architecture and the infrastructure; development of the interface, the integration of the client’s Excel engine, the licence system and the archiving; CI/CD pipeline and packaging of the executable."
    completed: "2026-05"
    grade: "5.9/6"
    featured: true
    summary: "Desktop software for a cardiology practice: import of DICOM or CSV exams, the cardiologist’s calculations and an automatic Word report; a real client project in a team of four."
    description: "Client project at HEG Geneva, run by four students from September 2025 to May 2026, with Scrum over six sprints. The client cardiologist wrote his echocardiography reports with an Excel and VBA prototype he had built himself, hard to maintain and to share. We replaced it with a Windows application that reads the exams exported by the ultrasound machine (DICOM or CSV), has the measurements calculated by his Excel engine and produces a Word report that he reviews and signs. Patient data stays on the practice’s computer; only the licence and usage statistics go through the client’s server. Version 1.0.0 was delivered with its installer, guides and release notes."
    highlights:
      - "**Project management**: Scrum Master; in charge of communication with the clients and the steering committee (sprint reviews, minutes); responsible for 11 of the 32 user stories and 43 of the 126 subtasks in the product backlog."
      - "**Documentation**: author of the application architecture and the infrastructure, then of the methodology, the planning and the project document."
      - "**My development work**: interface architecture and navigation, CSV import screen; integration of the Excel engine provided by the client, driven through COM (xlwings) with a grouped read of the results; licence system linked to a MariaDB server, with an offline mode and deferred synchronisation; exam archiving with XLSX export."
      - "**CI/CD and delivery**: Bitbucket Pipelines pipeline designed by me; tests on every pull request, then, on every merge, a Windows installer built from Linux in a Docker image referenced by its SHA-256 digest (Wine, Inno Setup); PyInstaller executable tested on clean machines."
      - "**Quality**: strict layered architecture, 780 automated tests (pytest), all passing; one pull request and one DoR/DoD checklist per user story."
      - "**Application delivered as version 1.0.0**: DICOM viewer in a 2×2 layout with cine loop playback, live report preview, separation between the ultrasound measurements and the cardiologist’s interpretations, report history and archiving."
      - "Source code in a private Bitbucket repository owned by the client; live demonstration of the application at the final presentation."
