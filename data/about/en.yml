# data/about/en.yml
# danielgarcia.it — English texts of the About page and of its panel on the home page
# ─────────────────────────────────────────────────────────────────────────────
# Read into the About record. fr.yml has exactly the same keys, the same
# sections in the same order, and the same number of paragraphs, items and
# technologies in each. Paragraphs accept Markdown (`code`); items and
# technologies are plain text. Never a server name, address or port here.

# Panel "How this site is built" on the home page, before the contact section
panel:
  title: "How this site is built"
  text: "This site deploys itself with a simple merge into the `main` branch of the GitHub repository. The code is tested there, then GitHub Actions builds the Docker image and publishes it on ghcr.io; my Infomaniak VPS then deploys it automatically. The site is generated by Roq on Quarkus and built with Maven, and Dependabot suggests dependency updates every week."
  button: "The full story"

# Introduction of the About page, under its title
intro:
  - "This site is my online resume, and it is also a project in its own right. I designed it, built it and put it into production following the same pipeline as a real software product: automated tests, a Docker image, continuous deployment, monitored backups. This page explains how."

# Sections of the About page, in display order; id is the anchor of the section
sections:
  - id: "principle"
    title: "The principle"
    paragraphs:
      - "The site is static: every page is generated once, at build time, then served as is. There is no database and no code running on each visit. The site therefore has a very small attack surface, and its pages load instantly."
      - "My career, my projects and my contact details are not written into the pages. They live in YAML files, one per language, which Java records read and check during the build. A missing date, a link without HTTPS or a forgotten translation makes the build fail, before the error can reach production."

  - id: "technologies"
    title: "Technologies"
    groups:
      - title: "Site generation"
        technologies:
          - name: "Roq"
            role: "a static site generator built on Quarkus; it turns the templates and the data into HTML pages."
          - name: "Quarkus and Java"
            role: "the build engine, and the records that read and check the data."
          - name: "Qute"
            role: "the page templates, split into reusable parts (header, project cards, footer)."
          - name: "Maven"
            role: "a single build command, the same on my computer, in CI and in Docker."
      - title: "Interface"
        technologies:
          - name: "HTML and CSS"
            role: "written by hand, without a framework."
          - name: "JavaScript"
            role: "a few small scripts (large cards, header, menu), bundled by the Quarkus Web Bundler, without Node. Without JavaScript, all the content stays readable."
      - title: "Delivery"
        technologies:
          - name: "GitHub Actions"
            role: "tests on every push and every pull request, then the image is built and published."
          - name: "Docker"
            role: "a two-stage image, first the Java build, then Nginx, which only contains the generated pages: no Java, no database, no secrets."
          - name: "GitHub Container Registry (ghcr.io)"
            role: "the registry where every version of the image is published and kept."
          - name: "Dependabot"
            role: "suggests dependency updates every week; I review each one before merging it."
      - title: "Server and operations"
        technologies:
          - name: "Infomaniak VPS running Ubuntu"
            role: "the server, which I administer myself."
          - name: "Docker Compose"
            role: "describes the site’s container and its connection to the proxy."
          - name: "Nginx and Let’s Encrypt"
            role: "a reverse proxy, the only entry point to the server, which handles HTTPS; its certificates renew automatically."
          - name: "systemd"
            role: "the timers of the automatic update and of the backup."
          - name: "restic and Swiss Backup"
            role: "the encrypted nightly backup, stored off the server."
          - name: "Healthchecks.io"
            role: "alerts me by e-mail if a backup fails or does not run."

  - id: "tests"
    title: "Tests"
    paragraphs:
      - "Every build runs the tests. They generate the whole site, serve it as in production and check every page in both languages: every section is there, the links to the resume and between pages, the header and the footer."
      - "Other tests check the data: both languages exist and have the same entries, in the same order, with the same contact details. A final test follows every internal link of the generated site: a broken link blocks the release."
      - "The tests check the structure, never the wording. I can rewrite a sentence without touching a test, but a section that disappears gets caught."

  - id: "delivery"
    title: "From commit to production"
    paragraphs:
      - "I work on a `develop` branch. Every push to it runs the tests and builds the Docker image, to check that it still builds, without publishing it."
      - "To release, I open a pull request from `develop` to `main`. GitHub refuses to merge it until the tests and the image build have passed. The `main` branch is protected: nobody can push to it directly, me included."
      - "The merge into `main` is the only manual step. GitHub Actions tests the site one last time, builds the image and publishes it on ghcr.io under two tags: the tag of its commit, which never changes, and `latest`, which always points to the most recent version. On the server, a timer checks every two minutes whether `latest` has changed. If it has, it pulls the new image, replaces the container and removes the old image. The site is down for only a second or two."
      - "Every Monday, the image is rebuilt with the latest versions of Nginx, the operating system and Java, then tested and published again. The site gets security fixes even when I don’t touch it. If the rebuild fails, nothing is published and the site keeps the version in service."

  - id: "rollback"
    title: "Rolling back"
    paragraphs:
      - "No version is ever overwritten: every published image stays in the registry under the tag of its commit. If a release causes a problem, one line on the server is enough to ask for a specific version instead of `latest`. On the timer’s next run, the previous version is back online. The server then ignores new releases until I remove that line, once the fix is published."

  - id: "server"
    title: "The server"
    paragraphs:
      - "The server is closed by default. SSH access works with a key only: no password, no direct login as administrator. Two firewalls, Infomaniak’s and the system’s, only let SSH and web traffic through. fail2ban blocks addresses that make repeated login attempts, and the system’s security updates install automatically."
      - "The site’s container can only be reached from the server itself. The reverse proxy is the only entry point: it redirects everything to HTTPS, with HSTS. Pages are served with a strict Content Security Policy: no script, font or tracker is loaded from another site."

  - id: "backups"
    title: "Backups"
    paragraphs:
      - "The server keeps no copy of the code. For this site, it only holds the Docker Compose file and the two systemd files of the automatic update. The code and its history are on GitHub, the images on ghcr.io."
      - "Every night, a script backs up the configuration written by hand on the server: these files, the reverse proxy and its certificates. It uses restic, which encrypts the data on the server before sending it to Swiss Backup, Infomaniak’s storage service, replicated across its data centers in Switzerland. Neither Infomaniak nor anyone else can read it without the key."
      - "Backups are kept for 14 days, then one a week for 8 weeks, then one a month for 6 months. A backup that has never been restored proves nothing: I tested the restore on the day it was set up, and I repeat it every quarter. Finally, every run reports to Healthchecks.io, an external service. If the signal reports a failure, or never arrives because the server is down, I get an e-mail."

  - id: "accessibility"
    title: "Accessibility"
    paragraphs:
      - "I designed the site to work just as well with a keyboard, with a screen reader or on a phone."
    items:
      - "Text has a contrast ratio of at least 4.5:1 with its background, in both themes."
      - "A “Skip to content” link jumps past the header, and the whole site can be used with a keyboard."
      - "The menu tells screen readers which section is being read."
      - "The large cards are native browser dialogs: they close with Escape and give focus back to the card that opened them."
      - "The light or dark theme follows the system setting, and a button lets you switch it."
      - "The typeface was designed for legibility: every character stands apart from the others, even for low vision."

  - id: "ai"
    title: "Use of AI"
    paragraphs:
      - "Claude (Anthropic) served as my development assistant: explanations, code suggestions and reviews. I ran every command and made every commit myself, and the technical choices and their validation are mine. The site itself uses no AI."

  - id: "credits"
    title: "Credits"
    items:
      - "Typeface: Atkinson Hyperlegible Next and Atkinson Hyperlegible Mono, by the Braille Institute of America, under the SIL Open Font License 1.1, hosted on this site."
      - "GitHub and LinkedIn are trademarks of their respective owners; their logos here point to my profiles."

  - id: "source-code"
    title: "Source code"
    paragraphs:
      - "All of the site’s code is public: templates, data, tests, workflow and Docker configuration, with its full history."
