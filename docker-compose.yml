# docker-compose.yml
#
# Docker Compose — the container of the site and how it is reached
# ─────────────────────────────────────────────────────────────────────────────
# Started with "docker compose up". One container: Nginx serving the pages
# generated by Roq. On the server, the reverse proxy of the machine passes
# the visitors' requests on to it.

# Prefix of every container and network created from this file. The proxy
# reaches the site by the name of its container, danielgarcia-it-site-1:
# renaming the project or the service breaks the site.
name: danielgarcia-it

services:
  site:
    # Image published by GitHub Actions, fetched with "docker compose pull".
    # With "docker compose up --build", it is built from the Dockerfile
    # instead: this is how a development machine runs its own code.
    # IMAGE_TAG chooses the version: "latest" unless it is set otherwise.
    image: ghcr.io/danielgarcia85/danielgarcia-it:${IMAGE_TAG:-latest}
    build: .
    # Restart after a crash or a reboot, unless it was stopped on purpose
    restart: unless-stopped
    # Local door of the site: port 8088 of this machine leads to Nginx, and
    # is reachable from this machine only. The proxy does not use it.
    ports:
      - "127.0.0.1:8088:80"
    # Network of the machine's reverse proxy, which passes the visitors'
    # requests on to this container
    networks:
      - proxy

networks:
  # "external" means that this file does not create the network: it must
  # already exist, created by the reverse proxy or by
  # "docker network create proxy".
  proxy:
    external: true
