# nginx.conf
# danielgarcia.it — Nginx configuration of the site image
# ─────────────────────────────────────────────────────────────────────────────
# Serves the static files generated by Roq. HTTPS, HSTS and the redirects of
# "www" and of plain HTTP belong to the reverse proxy of the server, in front
# of this container: here, plain HTTP on port 80, reachable inside Docker only.

server {
    # Port Nginx listens on inside the container
    listen 80;

    # Folder that holds the generated site, and the file served for a folder
    root /usr/share/nginx/html;
    index index.html;

    # No Nginx version in the error pages and in the "Server" header
    server_tokens off;

    # Redirects keep a relative address ("/en/"): an absolute one would carry
    # http and port 80 of this container, not the https address of the visitor
    absolute_redirect off;

    # Missing page: the "not found" page of the site, with the 404 status
    error_page 404 /404.html;

    # English pages: their own "not found" page, in English
    location /en/ {
        error_page 404 /en/404.html;
    }

    # Every response, error pages included ("always"). All add_header lines
    # stay here: one add_header in a location would drop all of these there.
    # The browser checks with the server before reusing a page it keeps, so a
    # new version is seen at once.
    add_header Cache-Control "no-cache" always;
    # The browser trusts the declared type of a file and never guesses it
    add_header X-Content-Type-Options "nosniff" always;
    # Other sites only learn the domain a visitor comes from, not the page
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Only files of this site are loaded, no plugin, no form sent elsewhere,
    # and no other site may show these pages in a frame
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
}
